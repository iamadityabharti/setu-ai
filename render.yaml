# Render blueprint for the Setu AI FastAPI backend.
services:
  - type: web
    name: setu-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt asyncpg greenlet
      python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DATABASE_URL
        fromDatabase:
          name: setu-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: USE_CELERY
        value: "false"
      - key: STT_BACKEND
        value: stub
      - key: TRANSLATE_BACKEND
        value: stub

databases:
  - name: setu-ai-db
    plan: free
